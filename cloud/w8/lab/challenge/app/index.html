<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>W8 Kubernetes Challenge</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #f6f8fb;
        color: #172033;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        width: min(920px, calc(100vw - 40px));
        padding: 40px;
        background: #ffffff;
        border: 1px solid #d9e1ee;
        border-radius: 8px;
        box-shadow: 0 18px 60px rgba(28, 43, 68, 0.12);
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 10px;
        padding: 8px 12px;
        border-radius: 999px;
        background: #e8f7ef;
        color: #17633a;
        font-weight: 700;
        font-size: 14px;
      }

      .dot {
        width: 10px;
        height: 10px;
        border-radius: 999px;
        background: #20b15a;
      }

      h1 {
        margin: 24px 0 12px;
        font-size: clamp(34px, 5vw, 56px);
        line-height: 1.02;
        letter-spacing: 0;
      }

      p {
        max-width: 720px;
        margin: 0;
        color: #4b5870;
        font-size: 18px;
        line-height: 1.7;
      }

      dl {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 16px;
        margin: 32px 0 0;
      }

      div.metric {
        padding: 18px;
        border: 1px solid #e1e7f0;
        border-radius: 8px;
        background: #fbfcff;
      }

      dt {
        color: #60708b;
        font-size: 13px;
        font-weight: 700;
        text-transform: uppercase;
      }

      dd {
        margin: 8px 0 0;
        font-size: 20px;
        font-weight: 800;
      }

      @media (max-width: 720px) {
        main {
          padding: 28px;
        }

        dl {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <span class="status"><span class="dot"></span>Running in Kubernetes</span>
      <h1>W8 K8s on AWS Challenge</h1>
      <p>
        This lightweight Nginx app is built as a Docker image, deployed into a
        Kubernetes cluster on EC2, and exposed to the Internet through an AWS
        Application Load Balancer.
      </p>
      <dl>
        <div class="metric">
          <dt>Workload</dt>
          <dd>Deployment</dd>
        </div>
        <div class="metric">
          <dt>Expose</dt>
          <dd>Service + ALB</dd>
        </div>
        <div class="metric">
          <dt>Health</dt>
          <dd>/healthz</dd>
        </div>
      </dl>
    </main>
  </body>
</html>
