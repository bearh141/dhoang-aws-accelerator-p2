<h1>W8 Challenge — Terraform 1-Click Deploy K8s on AWS</h1>
<p class="subtitle">Architecture Diagram · Region: ap-southeast-1 · Managed by Terraform</p>

<div class="diagram-wrap">
<svg width="1160" height="900" viewBox="0 0 1160 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arrow markers -->
    <marker id="arrow-black" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#232f3e"/>
    </marker>
    <marker id="arrow-gray" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#879196"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">

      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  USERS                                                      -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g transform="translate(440, 18)">

      <circle cx="20" cy="10" r="7" fill="none" stroke="#232f3e" stroke-width="2"/>
      <path d="M8,28 Q20,20 32,28" stroke="#232f3e" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(22,0)">
      <circle cx="20" cy="10" r="7" fill="none" stroke="#232f3e" stroke-width="2"/>
      <path d="M8,28 Q20,20 32,28" stroke="#232f3e" stroke-width="2" fill="none"/>
    </g>
    <g transform="translate(44,0)">
      <circle cx="20" cy="10" r="7" fill="none" stroke="#232f3e" stroke-width="2"/>
      <path d="M8,28 Q20,20 32,28" stroke="#232f3e" stroke-width="2" fill="none"/>
    </g>
    <text x="42" y="48" text-anchor="middle" font-size="12" font-weight="700" fill="#232f3e">Users</text>
  </g>

  <!-- Arrow: Users → ALB -->
  <line x1="482" y1="70" x2="482" y2="260" stroke="#232f3e" stroke-width="2" marker-end="url(#arrow-black)"/>
  <rect x="490" y="150" width="60" height="18" rx="2" fill="#fff" stroke="none"/>
  <text x="520" y="164" text-anchor="middle" font-size="10" font-weight="600" fill="#232f3e">HTTP :80</text>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  TERRAFORM (outside AWS Cloud)                              -->
  <!-- ════════════════════════════════════════════════════════════ -->
  <g transform="translate(30, 30)" filter="url(#icon-shadow)">
    <rect width="52" height="52" rx="6" fill="#7B42BC"/>
    <text x="26" y="22" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">TERA</text>
    <text x="26" y="35" text-anchor="middle" fill="#fff" font-size="9" font-weight="800">FORM</text>
    <text x="26" y="70" text-anchor="middle" font-size="11" font-weight="700" fill="#232f3e">Terraform</text>
    <text x="26" y="84" text-anchor="middle" font-size="9" font-weight="400" fill="#687078">IaC</text>
  </g>

  <!-- Arrow: Terraform → AWS Cloud -->

  <text x="127" y="48" text-anchor="middle" font-size="9" font-weight="600" fill="#7B42BC">provisions</text>

  <!-- ════════════════════════════════════════════════════════════ -->

    <text x="20" y="12" font-size="11" font-weight="600" fill="#147eba">Region: ap-southeast-1</text>
  </g>

  <!-- ════════════════════════════════════════════════════════════ -->
  <!--  VPC                                                        -->
  <!-- ════════════════════════════════════════════════════════════ -->
